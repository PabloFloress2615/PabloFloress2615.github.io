<svg class="diagram" viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrow" />
    </marker>
    <marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" class="d-arrow--accent" />
    </marker>
  </defs>

  <!-- users -->
  <rect class="d-box d-box--muted" x="420" y="10" width="160" height="42" rx="7" />
  <text class="d-title" x="500" y="37" text-anchor="middle">Users</text>
  <path class="d-edge" d="M500 52 L500 78" marker-end="url(#ah)" />

  <!-- front door -->
  <rect class="d-box d-box--accent" x="230" y="78" width="540" height="78" rx="7" />
  <text class="d-title" x="500" y="106" text-anchor="middle">Azure Front Door Premium</text>
  <text class="d-sub" x="500" y="128" text-anchor="middle">WAF · TLS termination · global health probes</text>
  <text class="d-mono" x="500" y="147" text-anchor="middle">origin reached over Private Link — app tier never public</text>

  <text class="d-accent-label" x="500" y="186" text-anchor="middle">health-probe failover &lt; 90 s</text>

  <!-- front door to each region -->
  <path class="d-edge d-edge--accent" d="M380 156 L380 190 Q380 206 364 206 L238 206 Q222 206 222 222 L222 230" marker-end="url(#ah-a)" />
  <path class="d-edge d-edge--dashed" d="M620 156 L620 190 Q620 206 636 206 L762 206 Q778 206 778 222 L778 230" marker-end="url(#ah)" />

  <!-- ===== primary region ===== -->
  <rect class="d-region" x="20" y="234" width="404" height="306" rx="10" />
  <text class="d-region-label" x="44" y="260">PRIMARY — EAST US 2</text>
  <text class="d-mono" x="400" y="260" text-anchor="end">active</text>

  <rect class="d-box d-box--accent" x="44" y="268" width="356" height="104" rx="7" />
  <text class="d-title" x="68" y="296">App Service</text>
  <text class="d-sub" x="68" y="316">zone-redundant</text>
  <rect class="d-chip" x="68" y="330" width="62" height="24" rx="4" />
  <text class="d-mono" x="99" y="346" text-anchor="middle">zone 1</text>
  <rect class="d-chip" x="138" y="330" width="62" height="24" rx="4" />
  <text class="d-mono" x="169" y="346" text-anchor="middle">zone 2</text>
  <rect class="d-chip" x="208" y="330" width="62" height="24" rx="4" />
  <text class="d-mono" x="239" y="346" text-anchor="middle">zone 3</text>

  <path class="d-edge" d="M222 372 L222 420" marker-end="url(#ah)" />
  <rect class="d-box d-box--muted" x="148" y="382" width="148" height="26" rx="4" />
  <text class="d-mono" x="222" y="399" text-anchor="middle">Private Link</text>

  <rect class="d-box d-box--accent" x="44" y="420" width="356" height="98" rx="7" />
  <text class="d-title" x="68" y="448">SQL Managed Instance</text>
  <text class="d-sub" x="68" y="468">Business Critical · private endpoint only</text>
  <text class="d-mono" x="68" y="492">role: primary</text>

  <!-- ===== secondary region ===== -->
  <rect class="d-region" x="576" y="234" width="404" height="306" rx="10" />
  <text class="d-region-label" x="600" y="260">DR — SOUTH CENTRAL US</text>
  <text class="d-mono" x="956" y="260" text-anchor="end">warm standby</text>

  <rect class="d-box" x="600" y="268" width="356" height="104" rx="7" />
  <text class="d-title" x="624" y="296">App Service</text>
  <text class="d-sub" x="624" y="316">zone-redundant · provisioned, idle</text>
  <rect class="d-chip" x="624" y="330" width="62" height="24" rx="4" />
  <text class="d-mono" x="655" y="346" text-anchor="middle">zone 1</text>
  <rect class="d-chip" x="694" y="330" width="62" height="24" rx="4" />
  <text class="d-mono" x="725" y="346" text-anchor="middle">zone 2</text>
  <rect class="d-chip" x="764" y="330" width="62" height="24" rx="4" />
  <text class="d-mono" x="795" y="346" text-anchor="middle">zone 3</text>

  <path class="d-edge" d="M778 372 L778 420" marker-end="url(#ah)" />
  <rect class="d-box d-box--muted" x="704" y="382" width="148" height="26" rx="4" />
  <text class="d-mono" x="778" y="399" text-anchor="middle">Private Link</text>

  <rect class="d-box" x="600" y="420" width="356" height="98" rx="7" />
  <text class="d-title" x="624" y="448">SQL Managed Instance</text>
  <text class="d-sub" x="624" y="468">Business Critical · private endpoint only</text>
  <text class="d-mono" x="624" y="492">role: secondary</text>

  <!-- replication across the gutter -->
  <path class="d-edge d-edge--accent" d="M400 497 L600 497" marker-end="url(#ah-a)" marker-start="url(#ah-a)" />
  <rect class="d-box" x="428" y="436" width="144" height="52" rx="6" />
  <text class="d-accent-label" x="500" y="458" text-anchor="middle">Auto-Failover</text>
  <text class="d-accent-label" x="500" y="474" text-anchor="middle">Group</text>
  <text class="d-mono" x="500" y="518" text-anchor="middle">lag 1–5 s</text>

  <!-- shared listener -->
  <rect class="d-box d-box--muted" x="20" y="568" width="960" height="62" rx="7" />
  <text class="d-title" x="500" y="594" text-anchor="middle">Auto-Failover Group listener</text>
  <text class="d-mono" x="500" y="616" text-anchor="middle">one stable endpoint for both regions — failover needs no connection-string change</text>
</svg>
