name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy the current main without pushing an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by actions/deploy-pages for OIDC — no PAT or deploy key needed.
  id-token: write

# Never run two deploys at once, and never cancel one midway: a cancelled
# deploy can leave the Pages site serving a partial artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Installs dependencies, runs `astro build`, and uploads dist/ as the
      # Pages artifact in one step.
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
